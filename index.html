<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZenTube - Minimalist YouTube</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0d0e" />

  <!-- Google Identity Services (GIS) Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- YouTube iFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-primary: #0d0d0e;
      --bg-surface: #17171a;
      --bg-surface-elevated: #222226;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f3f5;
      --text-secondary: #8e8e93;
      --accent-color: #ff3b30;
      --accent-hover: #ff453a;
      --success-color: #30d158;
      --nav-height: 64px;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
      min-height: 100vh;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 13, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background-color: var(--accent-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon::after {
      content: '';
      border-style: solid;
      border-width: 5px 0 5px 9px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 2px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn-header {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .auth-btn {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Container */
    main {
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Video Feed Grid */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 600px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .video-card {
      background: var(--bg-surface);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Watch Progress Badges */
    .watch-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .watch-badge.completed {
      background: rgba(48, 209, 88, 0.85);
    }

    .watch-badge.in-progress {
      background: rgba(255, 159, 10, 0.85);
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-color);
    }

    .video-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Video Player Modal */
    .player-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      display: none;
      flex-direction: column;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }

    .player-modal.active {
      display: flex;
    }

    .player-header {
      padding: calc(var(--safe-top) + 10px) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .player-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .icon-btn-circle {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    #youtube-player, #native-pip-video {
      width: 100%;
      height: 100%;
    }

    .player-details {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Docked Mini-Player Mode */
    .player-modal.docked {
      top: auto;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 10px);
      right: 12px;
      width: calc(100% - 24px);
      max-width: 360px;
      height: auto;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background: var(--bg-surface);
      overflow: hidden;
    }

    .player-modal.docked .player-header {
      padding: 8px 12px;
    }

    .player-modal.docked .player-details {
      display: none;
    }

    /* Channels Sub-View Overlay */
    .channel-detail-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      z-index: 500;
      display: none;
      flex-direction: column;
      padding-top: var(--safe-top);
    }

    .channel-detail-view.active {
      display: flex;
    }

    .channel-detail-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    /* Bottom Navigation Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(var(--nav-height) + var(--safe-bottom));
      background: rgba(23, 23, 26, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 11px;
      gap: 4px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item.active {
      color: var(--text-primary);
    }

    .nav-icon {
      font-size: 18px;
    }

    /* Views */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* Settings View Inputs */
    .settings-card {
      background: var(--bg-surface);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .input-field {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }

    .save-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-surface);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="logo-container">
      <div class="logo-icon"></div>
      <div class="logo-text">ZenTube</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn-header" onclick="manualRefreshFeed()" title="Refresh Feed">🔄</button>
      <button class="auth-btn" id="auth-btn" onclick="handleAuthClick()">
        <span>Sign In</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    <!-- Subscriptions Feed View -->
    <div id="feed-view" class="view active">
      <div class="section-title">
        <span>Subscriptions Feed</span>
        <span id="sync-status" style="font-size: 11px; color: var(--text-secondary);">Demo Mode</span>
      </div>
      <div class="video-grid" id="video-grid"></div>
    </div>

    <!-- Channels View -->
    <div id="channels-view" class="view">
      <div class="section-title">Subscribed Channels</div>
      <div id="channels-list" style="display: flex; flex-direction: column; gap: 10px;">
        <p style="color: var(--text-secondary); font-size: 14px;">Sign in with Google to view your subscribed channels.</p>
      </div>
    </div>

    <!-- Search View -->
    <div id="search-view" class="view">
      <div class="section-title">Search YouTube</div>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="search-input" class="input-field" placeholder="Search videos or topics..." onkeypress="if(event.key === 'Enter') executeSearch()" />
        <button class="save-btn" style="padding: 0 16px;" onclick="executeSearch()">Search</button>
      </div>
      <div class="video-grid" id="search-grid"></div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view">
      <div class="section-title">Settings & OAuth</div>
      <div class="settings-card">
        <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Google OAuth Client ID</label>
        <input type="text" id="client-id-input" class="input-field" placeholder="Paste your OAuth Client ID here" />
        <button class="save-btn" onclick="saveClientId()">Save Client ID</button>
      </div>

      <div class="settings-card">
        <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Watch Data</label>
        <button class="save-btn" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-color);" onclick="clearWatchHistory()">Clear Watch Progress Data</button>
      </div>
    </div>
  </main>

  <!-- Channel Detail Overlay -->
  <div class="channel-detail-view" id="channel-detail-view">
    <div class="channel-detail-header">
      <button class="icon-btn-circle" onclick="closeChannelDetail()">←</button>
      <div style="display: flex; align-items: center; gap: 10px;">
        <img id="channel-detail-avatar" style="width: 36px; height: 36px; border-radius: 50%;" />
        <div>
          <div id="channel-detail-name" style="font-weight: 700; font-size: 15px;"></div>
          <div style="font-size: 12px; color: var(--text-secondary);">Channel Recent Videos</div>
        </div>
      </div>
    </div>
    <div style="padding: 16px; overflow-y: auto; flex: 1;">
      <div class="video-grid" id="channel-videos-grid"></div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div class="player-modal" id="player-modal">
    <div class="player-header">
      <span class="video-title" id="player-title" style="font-size: 14px;">Playing Video</span>
      <div class="player-actions">
        <button class="icon-btn" id="pip-btn" onclick="enableNativeSystemPiP()" title="System PiP (HTML5)">
          <span>System PiP</span>
        </button>
        <button class="icon-btn-circle" onclick="toggleDockPlayer()" title="Dock Mini-Player">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="icon-btn-circle" onclick="closePlayer()">✕</button>
      </div>
    </div>
    <div class="player-container" id="player-container">
      <div id="youtube-player"></div>
      <video id="native-pip-video" controls playsinline style="display: none;"></video>
    </div>
    <div class="player-details">
      <h2 id="modal-video-title" style="font-size: 18px; margin-bottom: 8px;"></h2>
      <p id="modal-channel-title" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;"></p>
      <div style="padding: 12px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); font-size: 13px; color: var(--text-secondary); line-height: 1.4;" id="modal-description">
        Minimalist video view active.
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('feed-view', this)">
      <div class="nav-icon">📺</div>
      <span>Feed</span>
    </div>
    <div class="nav-item" onclick="switchTab('channels-view', this)">
      <div class="nav-icon">👥</div>
      <span>Channels</span>
    </div>
    <div class="nav-item" onclick="switchTab('search-view', this)">
      <div class="nav-icon">🔍</div>
      <span>Search</span>
    </div>
    <div class="nav-item" onclick="switchTab('settings-view', this)">
      <div class="nav-icon">⚙️</div>
      <span>Settings</span>
    </div>
  </nav>

  <script>
    let ytPlayer = null;
    let tokenClient = null;
    let accessToken = localStorage.getItem('zentube_token') || null;
    let clientId = localStorage.getItem('zentube_client_id') || '';
    let watchProgress = JSON.parse(localStorage.getItem('zentube_watch_progress') || '{}');
    let currentVideoId = null;
    let progressInterval = null;
    let activeFeedVideos = [];

    const demoVideos = [
      { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', channel: 'Rick Astley', duration: 213, thumbnail: 'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg' },
      { id: 'L_LUpnjgPso', title: 'Official Launch - iOS Design Overview', channel: 'Apple', duration: 600, thumbnail: 'https://i.ytimg.com/vi/L_LUpnjgPso/mqdefault.jpg' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('client-id-input').value = clientId;
      renderFeed(demoVideos, 'video-grid');
      initGoogleAuth();
    });

    function onYouTubeIframeAPIReady() {}

    function initGoogleAuth() {
      if (!clientId || !window.google) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/youtube.readonly',
        callback: (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            localStorage.setItem('zentube_token', accessToken);
            updateAuthUI(true);
            fetchSubscribedChannelsFeed();
          }
        },
      });

      if (accessToken) {
        updateAuthUI(true);
        fetchSubscribedChannelsFeed();
      }
    }

    function handleAuthClick() {
      if (accessToken) {
        accessToken = null;
        localStorage.removeItem('zentube_token');
        updateAuthUI(false);
        renderFeed(demoVideos, 'video-grid');
      } else if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: '' });
      } else {
        alert('Please save your OAuth Client ID in Settings first.');
        switchTab('settings-view', document.querySelectorAll('.nav-item')[3]);
      }
    }

    function updateAuthUI(isSignedIn) {
      const btn = document.getElementById('auth-btn');
      const status = document.getElementById('sync-status');
      if (isSignedIn) {
        btn.innerHTML = '<span>Sign Out</span>';
        status.textContent = 'Synced with Subscriptions';
        status.style.color = 'var(--success-color)';
      } else {
        btn.innerHTML = '<span>Sign In</span>';
        status.textContent = 'Demo Mode';
        status.style.color = 'var(--text-secondary)';
      }
    }

    function saveClientId() {
      const val = document.getElementById('client-id-input').value.trim();
      if (val) {
        clientId = val;
        localStorage.setItem('zentube_client_id', clientId);
        initGoogleAuth();
        alert('Client ID Saved!');
      }
    }

    function manualRefreshFeed() {
      if (accessToken) {
        fetchSubscribedChannelsFeed();
      } else {
        renderFeed(demoVideos, 'video-grid');
      }
    }

    async function fetchSubscribedChannelsFeed() {
      if (!accessToken) return;
      try {
        document.getElementById('sync-status').textContent = 'Updating Feed...';
        
        const subRes = await fetch('https://www.googleapis.com/youtube/v3/subscriptions?mine=true&part=snippet,contentDetails&maxResults=15', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const subData = await subRes.json();

        if (!subData.items) return;

        renderChannelsList(subData.items);

        let allVideos = [];
        
        for (const sub of subData.items) {
          try {
            const channelId = sub.snippet.resourceId.channelId;
            const channelRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?id=${channelId}&part=contentDetails`, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            const channelData = await channelRes.json();

            if (channelData.items && channelData.items.length > 0) {
              const uploadsPlaylistId = channelData.items[0].contentDetails.relatedPlaylists.uploads;

              const playlistRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?playlistId=${uploadsPlaylistId}&part=snippet&maxResults=3`, {
                headers: { Authorization: `Bearer ${accessToken}` }
              });
              const playlistData = await playlistRes.json();

              if (playlistData.items) {
                playlistData.items.forEach(item => {
                  allVideos.push({
                    id: item.snippet.resourceId.videoId,
                    title: item.snippet.title,
                    channel: item.snippet.channelTitle,
                    thumbnail: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url,
                    publishedAt: new Date(item.snippet.publishedAt)
                  });
                });
              }
            }
          } catch (innerErr) {
            console.warn('Skipping channel:', innerErr);
          }
        }

        allVideos.sort((a, b) => b.publishedAt - a.publishedAt);
        activeFeedVideos = allVideos;
        
        if (allVideos.length > 0) {
          renderFeed(allVideos, 'video-grid');
        } else {
          renderFeed(demoVideos, 'video-grid');
        }

        document.getElementById('sync-status').textContent = 'Live Feed';
        document.getElementById('sync-status').style.color = 'var(--success-color)';

      } catch (err) {
        console.error('Error fetching subscriptions feed:', err);
        document.getElementById('sync-status').textContent = 'Sync Error';
        renderFeed(demoVideos, 'video-grid');
      }
    }

    function renderChannelsList(channels) {
      const list = document.getElementById('channels-list');
      list.innerHTML = '';
      channels.forEach(item => {
        const snippet = item.snippet;
        const channelId = snippet.resourceId.channelId;
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.onclick = () => openChannelDetail(channelId, snippet.title, snippet.thumbnails.default.url);
        div.innerHTML = `
          <img src="${snippet.thumbnails.default.url}" style="width: 40px; height: 40px; border-radius: 50%;" />
          <div>
            <div style="font-weight: 600; font-size: 14px;">${snippet.title}</div>
            <div style="font-size: 12px; color: var(--text-secondary);">Tap to view recent uploads</div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function openChannelDetail(channelId, channelTitle, avatarUrl) {
      document.getElementById('channel-detail-name').textContent = channelTitle;
      document.getElementById('channel-detail-avatar').src = avatarUrl;
      const grid = document.getElementById('channel-videos-grid');
      grid.innerHTML = '<p style="color: var(--text-secondary);">Loading channel videos...</p>';
      document.getElementById('channel-detail-view').classList.add('active');

      try {
        const channelRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?id=${channelId}&part=contentDetails`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const channelData = await channelRes.json();

        if (channelData.items && channelData.items.length > 0) {
          const uploadsPlaylistId = channelData.items[0].contentDetails.relatedPlaylists.uploads;
          const playlistRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?playlistId=${uploadsPlaylistId}&part=snippet&maxResults=15`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const playlistData = await playlistRes.json();

          if (playlistData.items) {
            const videos = playlistData.items.map(item => ({
              id: item.snippet.resourceId.videoId,
              title: item.snippet.title,
              channel: item.snippet.channelTitle,
              thumbnail: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url
            }));
            renderFeed(videos, 'channel-videos-grid');
          }
        }
      } catch (err) {
        grid.innerHTML = '<p style="color: var(--text-secondary);">Unable to load channel uploads.</p>';
      }
    }

    function closeChannelDetail() {
      document.getElementById('channel-detail-view').classList.remove('active');
    }

    async function executeSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      const grid = document.getElementById('search-grid');
      grid.innerHTML = '<p style="color: var(--text-secondary);">Searching...</p>';

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?q=${encodeURIComponent(query)}&part=snippet&type=video&maxResults=12`, {
          headers: accessToken ? { Authorization: `Bearer ${accessToken}` } : {}
        });
        const data = await res.json();
        if (data.items) {
          const results = data.items.map(item => ({
            id: item.id.videoId,
            title: item.snippet.title,
            channel: item.snippet.channelTitle,
            thumbnail: item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url
          }));
          renderFeed(results, 'search-grid');
        }
      } catch (err) {
        grid.innerHTML = '<p style="color: var(--text-secondary);">Search failed. Verify connection or OAuth configuration.</p>';
      }
    }

    function renderFeed(videos, containerId) {
      const grid = document.getElementById(containerId);
      if (!grid) return;
      grid.innerHTML = '';

      videos.forEach(v => {
        const prog = watchProgress[v.id] || { currentTime: 0, duration: v.duration || 0 };
        const percent = prog.duration ? Math.min(100, Math.round((prog.currentTime / prog.duration) * 100)) : 0;
        
        let badgeHTML = '';
        if (percent >= 90) {
          badgeHTML = `<div class="watch-badge completed">✓ Watched</div>`;
        } else if (percent > 5) {
          badgeHTML = `<div class="watch-badge in-progress">${percent}%</div>`;
        }

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openPlayer(v.id, v.title, v.channel);
        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img class="thumbnail-img" src="${v.thumbnail}" alt="${v.title}" />
            ${badgeHTML}
            ${percent > 0 && percent < 90 ? `<div class="progress-bar-container"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div>` : ''}
          </div>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="video-meta">${v.channel}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPlayer(videoId, title, channel) {
      currentVideoId = videoId;
      const modal = document.getElementById('player-modal');
      modal.classList.remove('docked');
      modal.classList.add('active');

      document.getElementById('youtube-player').style.display = 'block';
      document.getElementById('native-pip-video').style.display = 'none';

      document.getElementById('player-title').textContent = title;
      document.getElementById('modal-video-title').textContent = title;
      document.getElementById('modal-channel-title').textContent = channel;

      const savedTime = watchProgress[videoId] ? watchProgress[videoId].currentTime : 0;

      if (!ytPlayer) {
        ytPlayer = new YT.Player('youtube-player', {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            start: Math.floor(savedTime),
            playsinline: 1,
            modestbranding: 1
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      } else {
        ytPlayer.loadVideoById({ videoId: videoId, startSeconds: Math.floor(savedTime) });
      }

      startProgressTracking();
    }

    // Robust System PiP Stream Fetcher (Multi-Instance Fallback)
    async function enableNativeSystemPiP() {
      if (!currentVideoId) return;
      const videoEl = document.getElementById('native-pip-video');
      const ytEl = document.getElementById('youtube-player');
      const pipBtn = document.getElementById('pip-btn');

      pipBtn.textContent = 'Connecting...';

      // Pool of public proxy instances to attempt
      const instances = [
        'https://inv.nadeko.net',
        'https://invidious.nerdvpn.de',
        'https://inv.thepixora.com',
        'https://invidious.drgns.space'
      ];

      let streamUrl = null;

      for (const host of instances) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);

          const res = await fetch(`${host}/api/v1/videos/${currentVideoId}`, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.formatStreams && data.formatStreams.length > 0) {
              streamUrl = data.formatStreams[0].url;
              break;
            }
          }
        } catch (e) {
          console.warn(`Instance ${host} failed, trying next...`);
        }
      }

      pipBtn.textContent = 'System PiP';

      if (streamUrl) {
        ytEl.style.display = 'none';
        videoEl.style.display = 'block';
        videoEl.src = streamUrl;
        videoEl.play();

        if (videoEl.webkitSetPresentationMode) {
          videoEl.webkitSetPresentationMode('picture-in-picture');
        } else if (videoEl.requestPictureInPicture) {
          videoEl.requestPictureInPicture();
        }
      } else {
        alert('Native PiP stream proxy unavailable. Use standard full-screen or the Dock Player.');
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startProgressTracking();
      } else {
        stopProgressTracking();
      }
    }

    function startProgressTracking() {
      stopProgressTracking();
      progressInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime && currentVideoId) {
          const currentTime = ytPlayer.getCurrentTime();
          const duration = ytPlayer.getDuration();
          if (duration > 0) {
            watchProgress[currentVideoId] = { currentTime, duration, updatedAt: Date.now() };
            localStorage.setItem('zentube_watch_progress', JSON.stringify(watchProgress));
          }
        }
      }, 3000);
    }

    function stopProgressTracking() {
      if (progressInterval) clearInterval(progressInterval);
    }

    function closePlayer() {
      stopProgressTracking();
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      const videoEl = document.getElementById('native-pip-video');
      videoEl.pause();
      videoEl.src = '';
      const modal = document.getElementById('player-modal');
      modal.classList.remove('active', 'docked');
    }

    function toggleDockPlayer() {
      const modal = document.getElementById('player-modal');
      modal.classList.toggle('docked');
    }

    function clearWatchHistory() {
      if (confirm('Clear all local watch progress data?')) {
        watchProgress = {};
        localStorage.removeItem('zentube_watch_progress');
        renderFeed(activeFeedVideos.length ? activeFeedVideos : demoVideos, 'video-grid');
      }
    }

    function switchTab(viewId, el) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      el.classList.add('active');
    }
  </script>
</body>
