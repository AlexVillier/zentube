<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenTube - Minimalist PWA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --accent-color: #ff0033;
            --surface-color: #212121;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px;
            background: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }
        .controls-overlay {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--surface-color);
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
        .pip-btn {
            background: var(--surface-color);
            border: 1px solid #444;
        }
        .meta-info {
            margin-top: 16px;
        }
        .meta-info h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .meta-info p {
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZenTube PWA</h1>
        <button class="pip-btn" id="pipToggleBtn">PiP Mode</button>
    </header>

    <div class="container">
        <div class="player-wrapper">
            <!-- iOS Safari requires playsinline, webkit-playsinline, and controls for reliable hardware hookups -->
            <video 
                id="zentubePlayer" 
                playsinline 
                webkit-playsinline 
                controls
                preload="metadata"
                poster="">
            </video>
        </div>

        <div class="controls-overlay">
            <input type="text" id="videoUrlInput" placeholder="Enter YouTube URL or Video ID (e.g. 8DEfI1h-VBY)" value="8DEfI1h-VBY">
            <button id="loadBtn">Stream</button>
        </div>

        <div class="meta-info">
            <h2 id="videoTitle">Ready to Stream</h2>
            <p id="videoChannel">Proxy Status: Connected via Local Invidious Backend</p>
        </div>
    </div>

    <script>
        // Configure your self-hosted Invidious proxy endpoint here
        const INVIDIOUS_API_BASE = ""; 

        const videoPlayer = document.getElementById('zentubePlayer');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadBtn = document.getElementById('loadBtn');
        const pipToggleBtn = document.getElementById('pipToggleBtn');
        const videoTitle = document.getElementById('videoTitle');

        async function loadVideo(query) {
            let videoId = query.trim();
            
            // Basic URL cleaner to extract video ID if a full link is pasted
            if (videoId.includes('youtube.com') || videoId.includes('youtu.be')) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = videoId.match(regExp);
                if (match && match[2].length === 11) {
                    videoId = match[2];
                }
            }

            if (!videoId) return;

            videoTitle.textContent = "Fetching stream data from proxy...";

            try {
                // Fetch video details and direct adaptive stream links via Invidious API
                const response = await fetch(`${INVIDIOUS_API_BASE}/api/v1/videos/${videoId}`);
                if (!response.ok) throw new Error(`Proxy error: ${response.statusText}`);
                
                const data = await response.json();
                videoTitle.textContent = data.title || "Untitled Video";

                // Grab the highest priority adaptive stream URL (fallback to conventional format if needed)
                const streams = data.adaptiveFormats || [];
                const bestStream = streams.find(s => s.type && s.type.includes('video/mp4') && s.qualityLabel) || streams[0];
                
                if (bestStream && bestStream.url) {
                    videoPlayer.src = bestStream.url;
                    videoPlayer.play().catch(e => console.log("Autoplay blocked:", e));
                } else if (data.formatStreams && data.formatStreams.length > 0) {
                    videoPlayer.src = data.formatStreams[0].url;
                    videoPlayer.play();
                } else {
                    throw new Error("No valid playback streams found in API response.");
                }

            } catch (err) {
                console.error("Playback load failure:", err);
                videoTitle.textContent = "Error loading stream. Check console or proxy logs.";
            }
        }

        loadBtn.addEventListener('click', () => {
            loadVideo(videoUrlInput.value);
        });

        videoUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadVideo(videoUrlInput.value);
            }
        });

        // Robust Picture-in-Picture Trigger Handler for iOS/Safari WebKit
        pipToggleBtn.addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled) {
                    await videoPlayer.requestPictureInPicture();
                } else {
                    alert("Picture-in-Picture is not supported or permitted on this browser/device state.");
                }
            } catch (error) {
                console.error("PiP toggle failed:", error);
            }
        });

        // Initial load trigger on startup
        loadVideo(videoUrlInput.value);
    </script>
</body>
</html>
